spring:
  application:
    name: trackstore
  # Defaults for local development against compose.yaml. Elsewhere, override them with environment
  # variables (SPRING_DATASOURCE_URL, SPRING_DATASOURCE_PASSWORD, SPRING_KAFKA_BOOTSTRAP_SERVERS, ...).
  datasource:
    url: jdbc:postgresql://localhost:5432/trackstore
    username: trackstore
    password: secret   # local development only
    hikari:
      # Max wait for a pooled connection (default 30s). If the database is down, a request
      # fails after this long with 503 (see DatabaseUnavailableHandler) instead of hanging.
      # Milliseconds: binds to HikariConfig's long setter, so "2s" is not accepted here.
      connection-timeout: 2000
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: trackstore
      # A new consumer group starts from the beginning of the topic, not only new messages.
      auto-offset-reset: earliest
      # Key and value are read as plain strings (Spring Boot's default deserializers);
      # the JSON → TrackUpdate conversion happens at the listener (see KafkaConfig).
    listener:
      # One consumer thread per partition. Each partition is still consumed in order.
      concurrency: 3
      # The topics are created by the infrastructure (compose.yaml), not by this service.
      # If one is missing, refuse to start instead of waiting silently.
      missing-topics-fatal: true
  jpa:
    # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks
    # at startup that the entities match the tables, and fails fast if they don't.
    hibernate:
      ddl-auto: validate
    # We have no lazy-loading in web views; keep DB sessions out of HTTP requests.
    open-in-view: false
  mvc:
    # Error responses (404, 400, ...) as RFC 9457 "application/problem+json" bodies.
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      # Serve the endpoints at the root (/health, /metrics) instead of under /actuator.
      base-path: /
      # /health (incl. consumer lag), /metrics (browse by name) and /prometheus (scraped by the
      # Prometheus in compose.yaml, which keeps the history: time series, graphs).
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      show-details: always
      group:
        # /health/readiness: ready only once the backlog after a (re)start has been consumed.
        # (/health/liveness stays independent of Kafka: a lagging consumer must not be restarted.)
        readiness:
          include: readinessState, catchUp
  metrics:
    tags:
      # On every metric, so several services can share one Prometheus.
      application: ${spring.application.name}

trackstore:
  ingestion:
    # Ready for traffic once the total consumer lag has dropped to this many records (see CatchUpHealthIndicator).
    ready-max-lag: 10
    # How often the trackstore.ingestion.lag metric is refreshed from the broker (see ConsumerLagMetrics).
    lag-metric-interval: 5s
  picture:
    # Ages are measured from the track's latest observation timestamp (see PictureExpiryJob).
    stale-after: 10s      # no observation for this long → status STALE
    drop-after: 30s       # no observation for this long → removed from the picture (history is kept)
    check-interval: 2s    # how often the expiry job runs (also once at startup)
