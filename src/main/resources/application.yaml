spring:
  application:
    name: trackstore
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: trackstore
      # A new consumer group starts from the beginning of the topic, not only new messages.
      auto-offset-reset: earliest
      # Key and value are read as plain strings (Spring Boot's default deserializers);
      # the JSON → TrackUpdate conversion happens at the listener (see KafkaConfig).
    listener:
      # One consumer thread per partition. Each partition is still consumed in order.
      concurrency: 3
  jpa:
    # Flyway owns the schema (src/main/resources/db/migration); Hibernate only checks
    # at startup that the entities match the tables, and fails fast if they don't.
    hibernate:
      ddl-auto: validate
    # We have no lazy-loading in web views; keep DB sessions out of HTTP requests.
    open-in-view: false
  mvc:
    # Error responses (404, 400, ...) as RFC 9457 "application/problem+json" bodies.
    problemdetails:
      enabled: true

trackstore:
  picture:
    # Ages are measured from the track's latest observation timestamp (see PictureExpiryJob).
    stale-after: 10s      # no observation for this long → status STALE
    drop-after: 30s       # no observation for this long → removed from the picture (history is kept)
    check-interval: 2s    # how often the expiry job runs (also once at startup)
