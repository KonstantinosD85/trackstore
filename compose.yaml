# Local infrastructure for the track picture service. Start it before the service:
#   docker compose up -d --wait
# --wait returns once Postgres and Kafka are healthy and the topics have been created.
services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=trackstore'
      - 'POSTGRES_PASSWORD=secret'   # local development only
      - 'POSTGRES_USER=trackstore'
    ports:
      - '5432:5432'   # fixed host port: the service and DB tools (DBeaver, psql) connect here
    volumes:
      - 'postgres-data:/var/lib/postgresql/data'   # survives `docker compose down`
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trackstore -d trackstore']
      interval: 2s
      timeout: 5s
      retries: 30

  kafka:
    # Single-node Kafka in KRaft mode (no ZooKeeper). Once any KAFKA_* variable is set, the image
    # no longer applies its built-in defaults, so the complete configuration is spelled out here.
    image: 'apache/kafka:4.1.0'
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      # Clients connect to the bootstrap address, then to this advertised address. The same port
      # inside and outside the container makes localhost:9092 work from both sides.
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      # Single broker: internal topics can only have one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init. Without this, the first client that mentions
      # a missing topic would silently create it — with 1 partition.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1']
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    # One-shot: creates the topics, then exits. Idempotent (--if-not-exists), so it is safe on
    # every `up`. It shares the broker's network namespace, so localhost:9092 is the broker.
    image: 'apache/kafka:4.1.0'
    network_mode: 'service:kafka'
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -e
        for topic in track-updates track-updates-dlt; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --describe

volumes:
  postgres-data:
