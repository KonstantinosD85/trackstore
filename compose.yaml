# Local environment of the track picture service. Two ways to use it:
#   docker compose up -d --wait                         infrastructure only; run the service on the
#                                                       host (make infra + make server)
#   docker compose --profile app up -d --build --wait   everything, the service as a container (make up)
# --wait returns once Postgres and Kafka are healthy and the topics have been created (and, with the
# app profile, once the service is ready).
# Prometheus (http://localhost:9090) scrapes the service's metrics once it runs.
services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=trackstore'
      - 'POSTGRES_PASSWORD=secret'   # local development only
      - 'POSTGRES_USER=trackstore'
    ports:
      - '5432:5432'   # fixed host port: the service and DB tools (DBeaver, psql) connect here
    volumes:
      - './postgres-data:/var/lib/postgresql/data'   # survives `docker compose down`
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trackstore -d trackstore']
      interval: 2s
      timeout: 5s
      retries: 30

  kafka:
    # Single-node Kafka in KRaft mode (no ZooKeeper). Once any KAFKA_* variable is set, the image
    # no longer applies its built-in defaults, so the complete configuration is spelled out here.
    image: 'apache/kafka:4.1.0'
    ports:
      - '9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@localhost:9093'
      # A client connects twice: to its bootstrap address, which answers "reach me at <advertised
      # address>", and then to that address for all real traffic. "localhost" means something
      # different on the host and in each container, so there is one listener per audience:
      #   PLAINTEXT  :9092   localhost:9092  programs on the host (make server, make sim, IntelliJ)
      #   DOCKER     :29092  kafka:29092     containers on the Compose network (the trackstore service)
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://localhost:9092,DOCKER://kafka:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT'
      # Single broker: internal topics can only have one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by kafka-init. Without this, the first client that mentions
      # a missing topic would silently create it — with 1 partition.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1']
      interval: 5s
      timeout: 10s
      retries: 20

  kafka-init:
    # One-shot: creates the topics, then exits. Idempotent (--if-not-exists), so it is safe on
    # every `up`. It shares the broker's network namespace, so localhost:9092 is the broker.
    image: 'apache/kafka:4.1.0'
    network_mode: 'service:kafka'
    depends_on:
      kafka:
        condition: service_healthy
    restart: 'no'
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        set -e
        for topic in track-updates track-updates-dlt; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 \
            --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --describe

  prometheus:
    # Scrapes http://<host>:8080/prometheus every 5 s and stores the time series (graphs, alerts).
    image: 'prom/prometheus:v3.5.0'
    ports:
      - '9090:9090'
    volumes:
      - './prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro'
    extra_hosts:
      - 'host.docker.internal:host-gateway'   # Docker Desktop has it built in; Linux needs this
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://localhost:9090/-/ready']
      interval: 2s
      timeout: 5s
      retries: 30

  trackstore:
    # The service as a container. Only with the "app" profile, so `docker compose up` (make infra)
    # still starts just the infrastructure for running the service on the host.
    profiles: ['app']
    build: .
    image: 'trackstore:local'
    ports:
      - '8080:8080'   # same port as on the host: Prometheus (host.docker.internal:8080) finds either
    environment:
      # application.yaml defaults to localhost (host mode); containers use the service names.
      SPRING_DATASOURCE_URL: 'jdbc:postgresql://postgres:5432/trackstore'
      SPRING_KAFKA_BOOTSTRAP_SERVERS: 'kafka:29092'
    depends_on:
      postgres:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    healthcheck:
      # Healthy = ready: started and caught up with the topic (the readiness group, see application.yaml).
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:8080/health/readiness']
      start_period: 60s
      interval: 3s
      timeout: 3s
      retries: 20
